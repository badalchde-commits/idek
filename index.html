<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Live Web App</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 50px 20px; background-color: #eef2f3; }
        .card { background: white; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
        h1 { color: #2c3e50; font-size: 24px; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #2ecc71; color: white; border: none; border-radius: 6px; font-weight: bold; transition: 0.2s; margin-top: 15px; }
        button:hover { background: #27ae60; }
        p { font-size: 18px; color: #7f8c8d; margin-top: 20px; min-height: 24px; font-weight: 500; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Frontend & Backend Connection</h1>
        <p>Click below to fetch a live message from your Python script.</p>
        <button onclick="callBackend()">Connect to Python</button>
        <p id="response-text"></p>
    </div>

    <script>
        async function callBackend() {
            const statusText = document.getElementById("response-text");
            statusText.innerText = "Connecting to Python...";
            statusText.style.color = "#f39c12";

            try {
                // This connects to the live server script we are launching next
                const response = await fetch('/api/greet');
                const data = await response.json();
                
                statusText.innerText = data.message;
                statusText.style.color = "#27ae60";
            } catch (error) {
                statusText.innerText = "Error reaching Python backend.";
                statusText.style.color = "#c0392b";
                console.error(error);
            }
        }
    </script>

</body>
</html>
